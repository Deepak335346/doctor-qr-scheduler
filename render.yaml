services:
  - type: web
    name: doctor-qr-scheduler
    env: node
    plan: free
    buildCommand: npm --prefix client install && npm --prefix client run build && npm install
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DOCTOR_USERNAME
        value: doctor
      - key: DOCTOR_PASSWORD
        value: Doctor@2026
      - key: DOCTOR_PIN
        value: "782104"
